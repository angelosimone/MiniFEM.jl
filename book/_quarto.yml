project:
  type: book

bibliography: references.bib
csl: nature-brackets-accessed.csl

book:
  title: "An Introduction to the Finite Element Method"
  subtitle: "A Step-by-Step Approach Using Julia"
  author: "Angelo Simone"
  chapters:
    - index.qmd
    - part: "Getting started"
      chapters:
        - chapters/julia-installation.qmd
        - chapters/julia-essentials.qmd
    - part: "Discrete systems and the direct stiffness method"
      chapters:
        - chapters/continuous-and-discrete-models.qmd
        - chapters/two-springs-direct-stiffness.qmd
        - chapters/two-springs-julia.qmd
        - chapters/two-springs-functions.qmd
        - chapters/two-springs-callable-analysis.qmd
        - chapters/two-springs-regression-tests.qmd
    - glossary.qmd
    - references.qmd

format:
  html:
    toc: true
    number-sections: true
    mainfont: "STIX Two Text"
    html-math-method:
      method: mathjax
      url: https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml-nofont.js
    include-in-header: fonts-mathjax.html

  pdf:
    pdf-engine: lualatex
    mainfont: "STIX Two Text"
    mathfont: "STIX Two Math"

execute:
  freeze: auto
