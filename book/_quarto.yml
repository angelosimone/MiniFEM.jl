project:
  type: book

book:
  title: "An Introduction to the Finite Element Method"
  subtitle: "A Step-by-Step Approach Using Julia"
  author: "Angelo Simone"
  chapters:
    - index.qmd

format:
  html:
    toc: true
    number-sections: true
    mainfont: "STIX Two Text"
    html-math-method:
      method: mathjax
      url: https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml-nofont.js
    include-in-header: fonts-mathjax.html

  pdf:
    pdf-engine: lualatex
    mainfont: "STIX Two Text"
    mathfont: "STIX Two Math"

execute:
  freeze: auto
